proxies:
  - type: vless
    name: EPODONIOS
    server: fr3.green-tg.com
    port: 443
    uuid: 21fc62af-c683-4cba-8e3f-d4c3c0234cdb
    udp: true
    tls: true
    client-fingerprint: chrome
    xudp: true
    network: ws
    ws-opts:
      path: /ws
      headers:
        User-Agent: Mozilla/5.0 (GitHub Actions; config-ranker)
  - type: vless
    name: EPODONIOS-01
    server: fr3.green-tg.com
    port: 443
    uuid: 21fc62af-c683-4cba-8e3f-d4c3c0234cdb
    udp: true
    tls: true
    client-fingerprint: chrome
    servername: fr3.green-tg.com
    xudp: true
    network: ws
    ws-opts:
      path: /ws
      headers:
        User-Agent: Mozilla/5.0 (GitHub Actions; config-ranker)
        Host: fr3.green-tg.com
proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - Auto
      - EPODONIOS
      - EPODONIOS-01
  - name: Auto
    type: url-test
    url: https://connectivitycheck.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    proxies:
      - EPODONIOS
      - EPODONIOS-01
rules:
  - MATCH,Proxy
