proxies:
  - type: vless
    name: vless
    server: fast_s10.hutsharing.com
    port: 443
    uuid: a7ec0f75-880b-41c3-ba83-7d85b4861b3b
    udp: true
    tls: true
    client-fingerprint: chrome
    xudp: true
proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - Auto
      - vless
  - name: Auto
    type: url-test
    url: https://connectivitycheck.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    proxies:
      - vless
rules:
  - MATCH,Proxy
