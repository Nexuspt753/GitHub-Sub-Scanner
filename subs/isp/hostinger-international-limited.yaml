proxies:
  - type: vless
    name: vless
    server: static.lotussec.com
    port: 443
    uuid: 14b48651-3738-4926-bc09-4c04e87ff80b
    udp: true
    tls: true
    client-fingerprint: chrome
    alpn:
      - h2
    xudp: true
proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - Auto
      - vless
  - name: Auto
    type: url-test
    url: https://connectivitycheck.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    proxies:
      - vless
rules:
  - MATCH,Proxy
