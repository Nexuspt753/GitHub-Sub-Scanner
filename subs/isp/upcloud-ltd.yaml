proxies:
  - type: vless
    name: awlix_ir
    server: 87.58.159.20
    port: 443
    uuid: awlix_ir
    udp: true
    xudp: true
proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - Auto
      - awlix_ir
