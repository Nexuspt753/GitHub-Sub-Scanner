proxies:
  - type: vless
    name: DeltaKroneckerGithub
    server: 77.222.53.158
    port: 4100
    uuid: 6bd3e20b-4be0-41df-a1e0-5c147cc8fbfc
    udp: true
    xudp: true
    network: ws
    ws-opts:
      path: /v1
      headers:
        User-Agent: Mozilla/5.0 (GitHub Actions; config-ranker)
        Host: live.ok.ru
proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - Auto
      - DeltaKroneckerGithub
  - name: Auto
    type: url-test
    url: https://connectivitycheck.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    proxies:
      - DeltaKroneckerGithub
rules:
  - MATCH,Proxy
