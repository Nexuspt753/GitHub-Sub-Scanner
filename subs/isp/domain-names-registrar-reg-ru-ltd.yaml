proxies:
  - type: vless
    name: DeltaKroneckerGithub
    server: 80.78.245.48
    port: 8880
    uuid: 6ed59a5b-efef-4ddf-99f2-57d200caed47
    udp: true
    xudp: true
    network: ws
    ws-opts:
      path: /cdn/assets/stream
      headers:
        User-Agent: Mozilla/5.0 (GitHub Actions; config-ranker)
        Host: cnd.netherlands.myfilecdn.com
proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - Auto
      - DeltaKroneckerGithub
  - name: Auto
    type: url-test
    url: https://connectivitycheck.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    proxies:
      - DeltaKroneckerGithub
rules:
  - MATCH,Proxy
