proxies:
  - type: vless
    name: EPODONIOS
    server: 59.3.3.161
    port: 443
    uuid: c82f8880-bdd8-4a35-b8e7-ad5aa880f7d0
    udp: true
    tls: true
    client-fingerprint: chrome
    servername: vb.ylkszy.eu.org
    xudp: true
    network: ws
    ws-opts:
      path: /
      headers:
        User-Agent: Mozilla/5.0 (GitHub Actions; config-ranker)
proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - Auto
      - EPODONIOS
  - name: Auto
    type: url-test
    url: https://connectivitycheck.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    proxies:
      - EPODONIOS
rules:
  - MATCH,Proxy
