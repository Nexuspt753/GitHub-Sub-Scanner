proxies:
  - type: vless
    name: DeltaKroneckerGithub
    server: 143.20.156.116
    port: 443
    uuid: 4e4f1f70-5e56-4a76-bb9d-db087f4690c4
    udp: true
    tls: true
    client-fingerprint: unsafe
    servername: jp3.yohototo.top
    xudp: true
    network: ws
    ws-opts:
      path: /tyxyws
      headers:
        User-Agent: Mozilla/5.0 (GitHub Actions; config-ranker)
        Host: jp3.yohototo.top
proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - Auto
      - DeltaKroneckerGithub
  - name: Auto
    type: url-test
    url: https://connectivitycheck.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    proxies:
      - DeltaKroneckerGithub
rules:
  - MATCH,Proxy
