proxies:
  - type: vmess
    name: DeltaKroneckerGithub
    server: 131.196.252.59
    port: 20521
    uuid: 5809911a-a16e-43d3-90b0-2c94cfc2035e
    alterId: 0
    cipher: auto
    udp: true
    xudp: true
    skip-cert-verify: false
    network: ws
    ws-opts:
      path: /
      headers:
        User-Agent: Mozilla/5.0 (GitHub Actions; config-ranker)
proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - Auto
      - DeltaKroneckerGithub
  - name: Auto
    type: url-test
    url: https://connectivitycheck.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    proxies:
      - DeltaKroneckerGithub
rules:
  - MATCH,Proxy
