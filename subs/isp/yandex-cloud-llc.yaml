proxies:
  - type: vless
    name: DeltaKroneckerGithub
    server: 51.250.4.141
    port: 8443
    uuid: 5ca83936-136d-4314-8453-4ba10a86cf60
    udp: true
    tls: true
    client-fingerprint: firefox
    alpn:
      - http/1.1
    servername: cloudflare.vhub.pro
    xudp: true
    network: ws
    ws-opts:
      path: /websocket?ed=2560
      headers:
        User-Agent: Mozilla/5.0 (GitHub Actions; config-ranker)
        Host: cloudflare.vhub.pro
  - type: vless
    name: vless
    server: 188.72.103.4
    port: 443
    uuid: f3c44fd2-a2f0-475d-864d-785403c4feec
    udp: true
    xudp: true
  - type: vless
    name: vless-01
    server: 188.72.103.4
    port: 443
    uuid: fed28739-fcbc-4b28-867b-c241cf5b7c80
    udp: true
    xudp: true
proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - Auto
      - DeltaKroneckerGithub
      - vless
      - vless-01
  - name: Auto
    type: url-test
    url: https://connectivitycheck.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    proxies:
      - DeltaKroneckerGithub
      - vless
      - vless-01
rules:
  - MATCH,Proxy
