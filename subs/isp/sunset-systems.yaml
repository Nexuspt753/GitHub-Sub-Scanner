proxies:
  - type: vless
    name: DeltaKroneckerGithub
    server: journallattice.lucheeebezlimitnoekino.stream
    port: 443
    uuid: 983b70ea-dabc-481a-a7cd-bd6603e0a624
    udp: true
    tls: true
    client-fingerprint: firefox
    servername: journallattice.lucheeebezlimitnoekino.stream
    xudp: true
    network: ws
    ws-opts:
      path: /media/ws/
      headers:
        User-Agent: Mozilla/5.0 (GitHub Actions; config-ranker)
proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - Auto
      - DeltaKroneckerGithub
  - name: Auto
    type: url-test
    url: https://connectivitycheck.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    proxies:
      - DeltaKroneckerGithub
rules:
  - MATCH,Proxy
