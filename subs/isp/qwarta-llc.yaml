proxies:
  - type: vless
    name: DeltaKroneckerGithub
    server: ru.dostupnety.website
    port: 443
    uuid: 2c5e1028-528f-4017-8832-addcb6797ddf
    udp: true
    tls: true
    client-fingerprint: firefox
    servername: ru.dostupnety.website
    xudp: true
    network: ws
    ws-opts:
      path: /ws-hidden
      headers:
        User-Agent: Mozilla/5.0 (GitHub Actions; config-ranker)
        Host: ru.dostupnety.website
proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - Auto
      - DeltaKroneckerGithub
  - name: Auto
    type: url-test
    url: https://connectivitycheck.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    proxies:
      - DeltaKroneckerGithub
rules:
  - MATCH,Proxy
