proxies:
  - type: vmess
    name: filembad
    server: irc.jahancloud.cfd
    port: 443
    uuid: 5a7a77cb-956d-49d8-9195-cc756d991796
    alterId: 0
    cipher: auto
    udp: true
    xudp: true
    skip-cert-verify: false
proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - Auto
      - filembad
  - name: Auto
    type: url-test
    url: https://connectivitycheck.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    proxies:
      - filembad
rules:
  - MATCH,Proxy
