proxies:
  - type: vless
    name: vless
    server: r5.pythonmakemigreat.wiki
    port: 8443
    uuid: f8d52ece-fad4-478d-875d-df6eed3befa7
    udp: true
    tls: true
    client-fingerprint: chrome
    xudp: true
proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - Auto
      - vless
  - name: Auto
    type: url-test
    url: https://connectivitycheck.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    proxies:
      - vless
rules:
  - MATCH,Proxy
