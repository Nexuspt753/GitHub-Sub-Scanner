proxies:
  - type: vless
    name: vless
    server: nim.marlifo.ir
    port: 443
    uuid: 9308a0b3-001b-4803-bfb6-4335beda8b89
    udp: true
    tls: true
    client-fingerprint: chrome
    xudp: true
proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - Auto
      - vless
  - name: Auto
    type: url-test
    url: https://connectivitycheck.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    proxies:
      - vless
rules:
  - MATCH,Proxy
