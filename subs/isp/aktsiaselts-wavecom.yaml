proxies:
  - type: vless
    name: DeltaKroneckerGithub
    server: 38.180.163.250
    port: 443
    uuid: c4edb87e-8544-4fa4-bd1c-b0cda9a34b46
    udp: true
    tls: true
    client-fingerprint: unsafe
    alpn:
      - http/1.1
    servername: a.cwvps.eu.org
    xudp: true
    network: ws
    ws-opts:
      path: /ws#/?TELEGRAM--MARAMBASHI--MARAMBASHI?ed=512
      headers:
        User-Agent: Mozilla/5.0 (GitHub Actions; config-ranker)
        Host: a.cwvps.eu.org
proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - Auto
      - DeltaKroneckerGithub
  - name: Auto
    type: url-test
    url: https://connectivitycheck.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    proxies:
      - DeltaKroneckerGithub
rules:
  - MATCH,Proxy
