proxies:
  - type: vless
    name: vless
    server: czechia.richforever.ru
    port: 443
    uuid: 3dbd9377-43cc-46c3-b32c-2605908024eb
    udp: true
    tls: true
    client-fingerprint: chrome
    xudp: true
proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - Auto
      - vless
  - name: Auto
    type: url-test
    url: https://connectivitycheck.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    proxies:
      - vless
rules:
  - MATCH,Proxy
