proxies:
  - type: vless
    name: vless
    server: turkey.daltoon-cloud.ir
    port: 2083
    uuid: 122b8a33-d923-48a6-8f1b-e721cf842864
    udp: true
    tls: true
    client-fingerprint: chrome
    alpn:
      - h2
      - http/1.1
    xudp: true
proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - Auto
      - vless
  - name: Auto
    type: url-test
    url: https://connectivitycheck.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    proxies:
      - vless
rules:
  - MATCH,Proxy
