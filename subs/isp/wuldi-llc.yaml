proxies:
  - type: vless
    name: vless
    server: remotok.softupdatecenter.com
    port: 443
    uuid: 5de6a0ad-7d73-410b-ad50-a2bb5d47b93c
    udp: true
    tls: true
    client-fingerprint: chrome
    alpn:
      - h2
    xudp: true
proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - Auto
      - vless
  - name: Auto
    type: url-test
    url: https://connectivitycheck.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    proxies:
      - vless
rules:
  - MATCH,Proxy
