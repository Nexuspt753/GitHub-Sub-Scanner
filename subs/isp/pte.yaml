proxies:
  - type: vless
    name: EPODONIOS
    server: zoi.zelmuro.ir
    port: 44443
    uuid: bfb8547f-2789-4446-a3e8-fb353b66bea0
    udp: true
    tls: true
    client-fingerprint: chrome
    servername: zoi.zelmuro.ir
    xudp: true
    network: ws
    ws-opts:
      path: /
      headers:
        User-Agent: Mozilla/5.0 (GitHub Actions; config-ranker)
proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - Auto
      - EPODONIOS
  - name: Auto
    type: url-test
    url: https://connectivitycheck.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    proxies:
      - EPODONIOS
rules:
  - MATCH,Proxy
