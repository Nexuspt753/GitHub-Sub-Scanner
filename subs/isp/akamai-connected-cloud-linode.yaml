proxies:
  - type: vless
    name: DeltaKroneckerGithub
    server: free.nadun.store
    port: 443
    uuid: 20ff936a-8eb5-4d27-9cce-93f2016d467b
    udp: true
    tls: true
    client-fingerprint: chrome
    xudp: true
    network: ws
    ws-opts:
      path: /
      headers:
        User-Agent: Mozilla/5.0 (GitHub Actions; config-ranker)
proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - Auto
      - DeltaKroneckerGithub
  - name: Auto
    type: url-test
    url: https://connectivitycheck.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    proxies:
      - DeltaKroneckerGithub
rules:
  - MATCH,Proxy
