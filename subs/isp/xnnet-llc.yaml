proxies:
  - type: vless
    name: DeltaKroneckerGithub
    server: hk.mkdir.kdns.fr
    port: 443
    uuid: 2cf94f4d-9d5b-49ca-81a3-ddc0529a2dac
    udp: true
    tls: true
    client-fingerprint: chrome
    servername: pwdern.pages.dev
    xudp: true
    network: ws
    ws-opts:
      path: /
      headers:
        User-Agent: Mozilla/5.0 (GitHub Actions; config-ranker)
        Host: pwdern.pages.dev
proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - Auto
      - DeltaKroneckerGithub
  - name: Auto
    type: url-test
    url: https://connectivitycheck.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    proxies:
      - DeltaKroneckerGithub
rules:
  - MATCH,Proxy
