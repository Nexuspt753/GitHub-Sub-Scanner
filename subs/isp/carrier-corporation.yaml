proxies:
  - type: vless
    name: vless
    server: XCDN.DarinaService.IR
    port: 8443
    uuid: a6f263ad-2d3e-42c6-9584-ed80a5b1134d
    udp: true
    tls: true
    client-fingerprint: chrome
    alpn:
      - h3
      - ""
    servername: Iran.irandarina.ir
    xudp: true
proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - Auto
      - vless
  - name: Auto
    type: url-test
    url: https://connectivitycheck.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    proxies:
      - vless
rules:
  - MATCH,Proxy
