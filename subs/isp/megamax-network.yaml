proxies:
  - type: vless
    name: DeltaKroneckerGithub
    server: 212.67.9.113
    port: 2200
    uuid: 2aa7f4b1-e859-46d0-b8ac-8587811ab7b1
    udp: true
    xudp: true
    network: ws
    ws-opts:
      path: /v1
      headers:
        User-Agent: Mozilla/5.0 (GitHub Actions; config-ranker)
proxy-groups:
