proxies:
  - type: vless
    name: DeltaKroneckerGithub
    server: 194.154.30.154
    port: 443
    uuid: c7e9c591-2764-423a-afca-efbd010fd396
    udp: true
    tls: true
    client-fingerprint: chrome
    servername: forfreeuse.rtqa.ru
    xudp: true
    network: ws
    ws-opts:
      path: /
      headers:
        User-Agent: Mozilla/5.0 (GitHub Actions; config-ranker)
        Host: forfreeuse.rtqa.ru
  - type: vless
    name: vpnsal
    server: 5.187.7.220
    port: 443
    uuid: e911c552-3a98-41e0-b5fb-0dd3879887b7
    udp: true
    tls: true
    client-fingerprint: chrome
    servername: vod.ensf.top
    xudp: true
    network: ws
    ws-opts:
      path: /api/v1/irc
      headers:
        User-Agent: Mozilla/5.0 (GitHub Actions; config-ranker)
        Host: vod.ensf.top
proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - Auto
      - DeltaKroneckerGithub
      - vpnsal
  - name: Auto
    type: url-test
    url: https://connectivitycheck.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    proxies:
      - DeltaKroneckerGithub
      - vpnsal
rules:
  - MATCH,Proxy
