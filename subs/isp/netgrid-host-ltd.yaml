proxies:
  - type: vless
    name: vless
    server: cz.24outlook.space
    port: 2053
    uuid: e50f1e5f-2823-4030-9dd2-6c951b6b83d0
    udp: true
    tls: true
    client-fingerprint: chrome
    alpn:
      - h2
      - http/1.1
    xudp: true
proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - Auto
      - vless
  - name: Auto
    type: url-test
    url: https://connectivitycheck.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    proxies:
      - vless
rules:
  - MATCH,Proxy
