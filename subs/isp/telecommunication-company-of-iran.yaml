proxies:
  - type: vless
    name: EPODONIOS
    server: fr-emergency-service.pavilof.ir
    port: 8443
    uuid: a855c069-0173-4365-9a93-49e0fb3d3de1
    udp: true
    tls: true
    client-fingerprint: chrome
    alpn:
      - h2
      - http/1.1
    servername: fr-emergency-service.pavilof.ir
    xudp: true
    network: ws
    ws-opts:
      path: /
      headers:
        User-Agent: Mozilla/5.0 (GitHub Actions; config-ranker)
        Host: fr-emergency-service.pavilof.ir
proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - Auto
      - EPODONIOS
  - name: Auto
    type: url-test
    url: https://connectivitycheck.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    proxies:
      - EPODONIOS
rules:
  - MATCH,Proxy
