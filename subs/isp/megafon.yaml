proxies:
  - type: vless
    name: vless
    server: server3.benzin.dpdns.org
    port: 443
    uuid: a3c2ed66-2a7c-4a39-96df-b70fbfde750f
    udp: true
    tls: true
    client-fingerprint: chrome
    alpn:
      - h2
      - http/1.1
    xudp: true
proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - Auto
      - vless
  - name: Auto
    type: url-test
    url: https://connectivitycheck.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    proxies:
      - vless
rules:
  - MATCH,Proxy
