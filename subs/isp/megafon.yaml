proxies:
  - type: vless
    name: vless
    server: ivox7.nevcore.ru
    port: 443
    uuid: ff6e1028-b337-4062-a4db-86c784a9cdb4
    udp: true
    tls: true
    client-fingerprint: chrome
    alpn:
      - h2
    xudp: true
proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - Auto
      - vless
  - name: Auto
    type: url-test
    url: https://connectivitycheck.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    proxies:
      - vless
rules:
  - MATCH,Proxy
