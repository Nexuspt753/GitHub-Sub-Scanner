proxies:
  - type: vless
    name: vless
    server: v-cdn.layeriq.ru
    port: 443
    uuid: db4fb2a7-a31d-46d8-b6d2-76eafe8cfe2a
    udp: true
    tls: true
    client-fingerprint: chrome
    xudp: true
proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - Auto
      - vless
  - name: Auto
    type: url-test
    url: https://connectivitycheck.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    proxies:
      - vless
rules:
  - MATCH,Proxy
