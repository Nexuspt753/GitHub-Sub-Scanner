proxies:
  - type: vless
    name: EPODONIOS
    server: tuurk2.meligolit.lol
    port: 5678
    uuid: 876c4968-df77-4b80-87b0-c180ffb0853c
    udp: true
    xudp: true
    network: ws
    ws-opts:
      path: /
      headers:
        User-Agent: Mozilla/5.0 (GitHub Actions; config-ranker)
proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - Auto
      - EPODONIOS
  - name: Auto
    type: url-test
    url: https://connectivitycheck.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    proxies:
      - EPODONIOS
rules:
  - MATCH,Proxy
