proxies:
  - type: vless
    name: EPODONIOS
    server: dk2.darknet-bot.co.uk
    port: 443
    uuid: 3f373e36-6363-4f3e-8ca3-0504612f490e
    udp: true
    tls: true
    client-fingerprint: chrome
    alpn:
      - h2
    xudp: true
    network: grpc
    grpc-opts:
      grpc-service-name: /
proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - Auto
      - EPODONIOS
  - name: Auto
    type: url-test
    url: https://connectivitycheck.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    proxies:
      - EPODONIOS
rules:
  - MATCH,Proxy
