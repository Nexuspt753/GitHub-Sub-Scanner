proxies:
  - type: vless
    name: DeltaKroneckerGithub
    server: node.cz.teleserch.ru
    port: 443
    uuid: cec9a167-6381-4752-9828-a92ab6e6ebdd
    udp: true
    tls: true
    client-fingerprint: chrome
    alpn:
      - h2
      - http/1.1
    servername: node.cz.teleserch.ru
    flow: xtls-rprx-vision
    xudp: true
proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - Auto
      - DeltaKroneckerGithub
  - name: Auto
    type: url-test
    url: https://connectivitycheck.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    proxies:
      - DeltaKroneckerGithub
rules:
  - MATCH,Proxy
