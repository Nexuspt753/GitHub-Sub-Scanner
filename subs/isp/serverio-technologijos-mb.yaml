    name: DeltaKroneckerGithub
    server: id.tutdesignstudio.site
    port: 8443
    uuid: b9125df6-2a60-4643-bcba-a5f78cb663a7
    udp: true
    tls: true
    client-fingerprint: firefox
    alpn:
      - http/1.1
