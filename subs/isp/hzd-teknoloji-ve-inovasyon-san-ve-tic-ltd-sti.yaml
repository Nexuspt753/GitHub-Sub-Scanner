proxies:
  - type: vless
    name: DeltaKroneckerGithub
    server: kebabyumyum.net
    port: 8443
    uuid: 8c0dd77e-bfc2-4818-88d4-d9a72ec8c1ee
    udp: true
    tls: true
    client-fingerprint: firefox
    servername: kebabyumyum.net
    xudp: true
    network: ws
    ws-opts:
      path: /vless
      headers:
        User-Agent: Mozilla/5.0 (GitHub Actions; config-ranker)
proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - Auto
      - DeltaKroneckerGithub
  - name: Auto
    type: url-test
    url: https://connectivitycheck.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    proxies:
      - DeltaKroneckerGithub
rules:
  - MATCH,Proxy
