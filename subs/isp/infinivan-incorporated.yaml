proxies:
  - type: vmess
    name: EPODONIOS
    server: 61.245.11.60
    port: 80
    uuid: a3e3a710-79f8-4ae0-b83c-607aab40d197
    alterId: 0
    cipher: auto
    udp: true
    xudp: true
    skip-cert-verify: false
    network: ws
    ws-opts:
      path: /vmess/
      headers:
        User-Agent: Mozilla/5.0 (GitHub Actions; config-ranker)
proxy-groups:
