proxies:
  - type: vless
    name: DeltaKroneckerGithub
    server: 168.222.202.114
    port: 2200
    uuid: 9c2307ba-7972-4ea5-a199-f2c80049be7f
    udp: true
    xudp: true
    network: ws
    ws-opts:
      path: /v1
      headers:
        User-Agent: Mozilla/5.0 (GitHub Actions; config-ranker)
        Host: rzd.ru
proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - Auto
      - DeltaKroneckerGithub
  - name: Auto
    type: url-test
    url: https://connectivitycheck.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    proxies:
      - DeltaKroneckerGithub
rules:
  - MATCH,Proxy
