proxies:
  - type: vless
    name: hex_proxy
    server: 168.222.141.146
    port: 2200
    uuid: bceda826-c83c-45d0-891e-15c4bfec76bc
    udp: true
    xudp: true
    network: ws
    ws-opts:
      path: /v1
      headers:
        User-Agent: Mozilla/5.0 (GitHub Actions; config-ranker)
        Host: rzd.ru
proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - Auto
      - hex_proxy
  - name: Auto
    type: url-test
    url: https://connectivitycheck.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    proxies:
      - hex_proxy
rules:
  - MATCH,Proxy
