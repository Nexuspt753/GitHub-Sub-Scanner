proxies:
  - type: vless
    name: DeltaKroneckerGithub
    server: 168.222.141.187
    port: 4100
    uuid: 2e228435-33a0-47d1-a1d8-9a34b5a03c45
    udp: true
    xudp: true
    network: ws
    ws-opts:
      path: /v1
      headers:
        User-Agent: Mozilla/5.0 (GitHub Actions; config-ranker)
        Host: live.ok.ru
proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - Auto
      - DeltaKroneckerGithub
  - name: Auto
    type: url-test
    url: https://connectivitycheck.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    proxies:
      - DeltaKroneckerGithub
rules:
  - MATCH,Proxy
