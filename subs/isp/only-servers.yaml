proxies:
  - type: vless
    name: vless
    server: sync.happ-soft.com
    port: 443
    uuid: 88081ee0-d46a-4913-acdc-5c78e018c44d
    udp: true
    tls: true
    client-fingerprint: chrome
    xudp: true
proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - Auto
      - vless
  - name: Auto
    type: url-test
    url: https://connectivitycheck.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    proxies:
      - vless
rules:
  - MATCH,Proxy
