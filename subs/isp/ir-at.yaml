    network: grpc
    grpc-opts:
      grpc-service-name: /
  - type: vless
    name: MyVless
    server: adgof.mgodping12.xyz
    port: 2086
    uuid: 716806be-54a1-4a76-9ab5-6af75028a0e1
    udp: true
    tls: true
    client-fingerprint: chrome
    alpn:
      - h2
      - http/1.1
      - h3
    xudp: true
    network: grpc
    grpc-opts:
      grpc-service-name: /
proxy-groups:
