proxies:
  - type: vless
    name: VPsave
    server: adgof.mgodping12.xyz
    port: 2087
    uuid: 39e3455f-f411-4f29-b506-40539ae8aaec
    udp: true
    tls: true
    client-fingerprint: chrome
    alpn:
      - h2
      - http/1.1
      - h3
    xudp: true
    network: grpc
    grpc-opts:
      grpc-service-name: /
proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - Auto
      - VPsave
  - name: Auto
    type: url-test
    url: https://connectivitycheck.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    proxies:
      - VPsave
rules:
  - MATCH,Proxy
