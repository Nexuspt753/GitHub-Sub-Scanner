proxies:
  - type: vless
    name: vless
    server: frs.netbazshop.ir
    port: 1001
    uuid: aa30eabd-6b06-4d32-bf86-d250f71aa1d1
    udp: true
    tls: true
    client-fingerprint: chrome
    xudp: true
proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - Auto
      - vless
  - name: Auto
    type: url-test
    url: https://connectivitycheck.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    proxies:
      - vless
rules:
  - MATCH,Proxy
