proxies:
  - type: vless
    name: DeltaKroneckerGithub
    server: 31.59.192.254
    port: 8080
    uuid: ccf353ca-fa34-43fc-8ed9-520fb9d74bf6
    udp: true
    tls: true
    client-fingerprint: firefox
    servername: va.stream-room.com
    xudp: true
    network: ws
    ws-opts:
      path: /vless-ws
      headers:
        User-Agent: Mozilla/5.0 (GitHub Actions; config-ranker)
proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - Auto
      - DeltaKroneckerGithub
  - name: Auto
    type: url-test
    url: https://connectivitycheck.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    proxies:
      - DeltaKroneckerGithub
rules:
  - MATCH,Proxy
