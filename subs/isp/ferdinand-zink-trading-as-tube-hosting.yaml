proxies:
  - type: vless
    name: vless
    server: nl4-1.axolab.org
    port: 443
    uuid: cd9955c2-4524-4f63-8b99-dd125ca7db14
    udp: true
    tls: true
    client-fingerprint: chrome
    xudp: true
proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - Auto
      - vless
  - name: Auto
    type: url-test
    url: https://connectivitycheck.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    proxies:
      - vless
rules:
  - MATCH,Proxy
