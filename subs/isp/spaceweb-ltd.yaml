proxies:
  - type: vless
    name: DeltaKroneckerGithub
    server: 77.222.47.204
    port: 4100
    uuid: 5c43b6d8-f71a-46d6-b804-f86349e6f313
    udp: true
    xudp: true
    network: ws
    ws-opts:
      path: /v1
      headers:
        User-Agent: Mozilla/5.0 (GitHub Actions; config-ranker)
        Host: live.ok.ru
proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - Auto
      - DeltaKroneckerGithub
  - name: Auto
    type: url-test
    url: https://connectivitycheck.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    proxies:
      - DeltaKroneckerGithub
rules:
  - MATCH,Proxy
