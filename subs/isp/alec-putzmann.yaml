proxies:
  - type: vless
    name: V2ray_Alpha🐼
    server: zavqeron.ir
    port: 2053
    uuid: d2edc028-3452-46b5-8098-c22690cd4549
    udp: true
    tls: true
    client-fingerprint: chrome
    alpn:
      - h3
      - h2
      - http/1.1
    servername: zavqeron.ir
    xudp: true
    network: ws
    ws-opts:
      path: /tr2-cdn
      headers:
        User-Agent: Mozilla/5.0 (GitHub Actions; config-ranker)
        Host: zavqeron.ir
proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - Auto
      - V2ray_Alpha🐼
  - name: Auto
    type: url-test
    url: https://connectivitycheck.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    proxies:
      - V2ray_Alpha🐼
rules:
  - MATCH,Proxy
