proxies:
  - type: vless
    name: DeltaKroneckerGithub
    server: au4.pad-sservice.lat
    port: 8443
    uuid: 2b0e5676-fb62-4bf0-9607-6e7818421e8e
    udp: true
    tls: true
    client-fingerprint: chrome
    servername: au4.pad-sservice.lat
    xudp: true
    network: ws
    ws-opts:
      path: /A14U
      headers:
        User-Agent: Mozilla/5.0 (GitHub Actions; config-ranker)
        Host: au4.pad-service.com
proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - Auto
      - DeltaKroneckerGithub
  - name: Auto
    type: url-test
    url: https://connectivitycheck.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    proxies:
      - DeltaKroneckerGithub
rules:
  - MATCH,Proxy
