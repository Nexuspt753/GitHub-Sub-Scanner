proxies:
  - type: vmess
    name: DeltaKroneckerGithub
    server: 170.239.86.176
    port: 40708
    uuid: 53005ac8-eed1-4e32-8183-7152e099877a
    alterId: 0
    cipher: auto
    udp: true
    xudp: true
    skip-cert-verify: false
    network: ws
    ws-opts:
      path: /arki?ed=2048
      headers:
        User-Agent: Mozilla/5.0 (GitHub Actions; config-ranker)
proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - Auto
      - DeltaKroneckerGithub
  - name: Auto
    type: url-test
    url: https://connectivitycheck.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    proxies:
      - DeltaKroneckerGithub
rules:
  - MATCH,Proxy
