proxies:
  - type: vless
    name: vless
    server: l50.hubnetwatchdssub.ir
    port: 8880
    uuid: a3db7a52-1be9-474e-b6f7-f381141e2f0d
    udp: true
    tls: true
    client-fingerprint: chrome
    xudp: true
proxy-groups:
