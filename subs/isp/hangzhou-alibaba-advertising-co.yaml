proxies:
  - type: vmess
    name: DeltaKroneckerGithub
    server: 39.108.113.127
    port: 10086
    uuid: 19ee3050-be66-4850-9f13-fc9d47487a3c
    alterId: 0
    cipher: auto
    udp: true
    xudp: true
    skip-cert-verify: false
    network: ws
    ws-opts:
      path: /
      headers:
        User-Agent: Mozilla/5.0 (GitHub Actions; config-ranker)
proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - Auto
      - DeltaKroneckerGithub
  - name: Auto
    type: url-test
    url: https://connectivitycheck.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    proxies:
      - DeltaKroneckerGithub
rules:
  - MATCH,Proxy
