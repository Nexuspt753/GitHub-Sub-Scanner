proxies:
  - type: vless
    name: EPODONIOS
    server: finland-3.kochvpn.pw
    port: 443
    uuid: 0648368d-d060-f954-40d7-161caf67e11e
    udp: true
    tls: true
    client-fingerprint: chrome
    servername: finland-3.kochvpn.pw
    xudp: true
    network: ws
    ws-opts:
      path: /stream/ws
      headers:
        User-Agent: Mozilla/5.0 (GitHub Actions; config-ranker)
  - type: vless
    name: 🇫🇮FI-🚀@VPNine1
