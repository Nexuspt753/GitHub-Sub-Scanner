proxies:
  - type: vless
    name: vless
    server: fi.alpheratzz.org
    port: 443
    uuid: b3441cc7-1e5f-4eb6-8207-90788eeca21e
    udp: true
    tls: true
    client-fingerprint: chrome
    alpn:
      - h2
    xudp: true
proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - Auto
      - vless
  - name: Auto
    type: url-test
    url: https://connectivitycheck.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    proxies:
      - vless
rules:
  - MATCH,Proxy
