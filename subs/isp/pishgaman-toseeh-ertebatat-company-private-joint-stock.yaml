proxies:
  - type: vless
    name: Tel-@ProxyMtAlpha🛣️
    server: lndtes.fastshieldd.sbs
    port: 443
    uuid: 91a45a01-970c-46b7-8044-b4f2121bb79e
    udp: true
    tls: true
    client-fingerprint: chrome
    xudp: true
    network: ws
    ws-opts:
      path: /
      headers:
        User-Agent: Mozilla/5.0 (GitHub Actions; config-ranker)
  - type: vless
    name: Tel-@ProxyMtAlpha🥔
    server: lndtes.fastshieldd.sbs
    port: 443
    uuid: 91a45a01-970c-46b7-8044-b4f2121bb79e
    udp: true
    tls: true
    client-fingerprint: chrome
    xudp: true
    network: ws
    ws-opts:
      path: /
      headers:
        User-Agent: Mozilla/5.0 (GitHub Actions; config-ranker)
  - type: vless
    name: vless
    server: gbtnfl2.fluxora.ir
    port: 2432
    uuid: e9560616-9899-4836-abdd-6caa52613768
    udp: true
    tls: true
    client-fingerprint: chrome
    xudp: true
proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - Auto
      - Tel-@ProxyMtAlpha🛣️
      - Tel-@ProxyMtAlpha🥔
      - vless
  - name: Auto
    type: url-test
    url: https://connectivitycheck.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    proxies:
      - Tel-@ProxyMtAlpha🛣️
      - Tel-@ProxyMtAlpha🥔
      - vless
rules:
  - MATCH,Proxy
