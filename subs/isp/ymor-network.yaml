proxies:
  - type: vless
    name: DeltaKroneckerGithub
    server: palimpcest.spravedlivost.fun
    port: 443
    uuid: c40ec629-cd50-4569-8ea7-ea7c498423fd
    udp: true
    tls: true
    client-fingerprint: random
    servername: palimpcest.spravedlivost.fun
    xudp: true
    network: ws
    ws-opts:
      path: /api/metric/ws
      headers:
        User-Agent: Mozilla/5.0 (GitHub Actions; config-ranker)
proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - Auto
      - DeltaKroneckerGithub
  - name: Auto
    type: url-test
    url: https://connectivitycheck.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    proxies:
      - DeltaKroneckerGithub
rules:
  - MATCH,Proxy
