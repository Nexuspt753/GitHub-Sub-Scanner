proxies:
  - type: vless
    name: vless
    server: sst.talachandnimhub-net.ir
    port: 1022
    uuid: be1ebe01-3d91-4dec-9adb-3c2948baca18
    udp: true
    xudp: true
proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - Auto
      - vless
  - name: Auto
    type: url-test
    url: https://connectivitycheck.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    proxies:
      - vless
rules:
  - MATCH,Proxy
