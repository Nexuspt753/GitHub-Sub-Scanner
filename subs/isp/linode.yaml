proxies:
  - type: vless
    name: DeltaKroneckerGithub
    server: asia.csmaster.site
    port: 443
    uuid: a853e120-3570-462b-aec1-e8f3d4f92d24
    udp: true
    tls: true
    client-fingerprint: chrome
    xudp: true
    network: ws
    ws-opts:
      path: /
      headers:
        User-Agent: Mozilla/5.0 (GitHub Actions; config-ranker)
        Host: asia.csmaster.site
  - type: vless
    name: DeltaKroneckerGithub-01
    server: 139.162.27.96
    port: 2096
    uuid: 6e59d5c5-7aa3-4c36-a4c4-e3b899525ed2
    udp: true
    tls: true
    client-fingerprint: chrome
    servername: free-server.techsonic.dev
    xudp: true
    network: ws
    ws-opts:
      path: /free-server.techsonic.dev
      headers:
        User-Agent: Mozilla/5.0 (GitHub Actions; config-ranker)
        Host: free-server.techsonic.dev
proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - Auto
      - DeltaKroneckerGithub
      - DeltaKroneckerGithub-01
  - name: Auto
    type: url-test
    url: https://connectivitycheck.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    proxies:
      - DeltaKroneckerGithub
      - DeltaKroneckerGithub-01
rules:
  - MATCH,Proxy
