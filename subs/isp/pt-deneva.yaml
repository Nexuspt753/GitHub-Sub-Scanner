proxies:
  - type: vmess
    name: DeltaKroneckerGithub
    server: free2.rajaserver2.web.id
    port: 443
    uuid: 4d4708ef-0729-44ac-b2b0-411ce0242e89
    alterId: 0
    cipher: auto
    udp: true
    xudp: true
    skip-cert-verify: false
    tls: true
    servername: free2.rajaserver2.web.id
    network: grpc
    grpc-opts:
      grpc-service-name: vmess-grpc
proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - Auto
      - DeltaKroneckerGithub
  - name: Auto
    type: url-test
    url: https://connectivitycheck.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    proxies:
      - DeltaKroneckerGithub
rules:
  - MATCH,Proxy
