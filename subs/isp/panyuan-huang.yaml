proxies:
  - type: vless
    name: vless
    server: tun.cellser.ir
    port: 2082
    uuid: cddd0717-87b6-4079-9d37-6967c449805f
    udp: true
    tls: true
    client-fingerprint: chrome
    xudp: true
proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - Auto
      - vless
  - name: Auto
    type: url-test
    url: https://connectivitycheck.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    proxies:
      - vless
rules:
  - MATCH,Proxy
