proxies:
  - type: vless
    name: DeltaKroneckerGithub
    server: 194.24.161.220
    port: 443
    uuid: 4c5a54b3-774e-4391-b78e-f3e9fa928792
    udp: true
    tls: true
    client-fingerprint: firefox
    servername: borsch2.spravedlivost.fun
    xudp: true
    network: ws
    ws-opts:
      path: /api/metric/ws
      headers:
        User-Agent: Mozilla/5.0 (GitHub Actions; config-ranker)
proxy-groups:
  - name: Proxy
    type: select
    proxies:
