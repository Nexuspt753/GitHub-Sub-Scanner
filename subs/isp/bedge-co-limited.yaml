proxies:
  - type: vless
    name: DeltaKroneckerGithub
    server: 149.104.79.85
    port: 443
    uuid: 218ae360-0e5f-4856-91f3-1823adfc9037
    udp: true
    tls: true
    client-fingerprint: firefox
    servername: mrs.sepporated.com
    xudp: true
    network: ws
    ws-opts:
      path: /ws
      headers:
        User-Agent: Mozilla/5.0 (GitHub Actions; config-ranker)
        Host: mrs.sepporated.com
proxy-groups:
