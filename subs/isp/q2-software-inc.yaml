proxies:
  - type: vless
    name: vless
    server: 192.0.54.181
    port: 443
    uuid: V2XNET
    udp: true
    tls: true
    client-fingerprint: chrome
    alpn:
      - h3
      - h2
      - http/1.1
    xudp: true
proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - Auto
      - vless
  - name: Auto
    type: url-test
    url: https://connectivitycheck.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    proxies:
      - vless
rules:
  - MATCH,Proxy
