proxies:
  - type: vless
    name: DeltaKroneckerGithub
    server: ru.pawnet.ink
    port: 443
    uuid: eb010bf0-a1c6-475c-a13c-d2500222292c
    udp: true
    tls: true
    client-fingerprint: qq
    flow: xtls-rprx-vision
    xudp: true
proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - Auto
      - DeltaKroneckerGithub
  - name: Auto
    type: url-test
    url: https://connectivitycheck.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    proxies:
      - DeltaKroneckerGithub
rules:
  - MATCH,Proxy
