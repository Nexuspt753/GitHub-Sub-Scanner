    name: DeltaKroneckerGithub
    server: 194.55.239.20
    port: 443
    uuid: 303035c0-dd28-4568-87bb-9a11637c5407
    udp: true
    tls: true
    client-fingerprint: firefox
    alpn:
      - http/1.1
