proxies:
  - type: vless
    name: DeltaKroneckerGithub
    server: india.shadowlos.top
    port: 443
    uuid: 170fb6f8-a34d-4f50-9275-e48ab47c58fd
    udp: true
    tls: true
    client-fingerprint: android
    servername: india.shadowlos.top
    xudp: true
    network: grpc
    grpc-opts:
      grpc-service-name: /
proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - Auto
      - DeltaKroneckerGithub
  - name: Auto
    type: url-test
    url: https://connectivitycheck.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    proxies:
      - DeltaKroneckerGithub
rules:
  - MATCH,Proxy
