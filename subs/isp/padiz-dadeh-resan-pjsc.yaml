proxies:
  - type: vless
    name: EPODONIOS
    server: iraslii.darklink.ir
    port: 2075
    uuid: e26d63c5-ca40-479d-a7c6-644b05a95921
    udp: true
    xudp: true
    network: ws
    ws-opts:
      path: /mamad
      headers:
        User-Agent: Mozilla/5.0 (GitHub Actions; config-ranker)
        Host: iraslii.darklink.ir
proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - Auto
      - EPODONIOS
  - name: Auto
    type: url-test
    url: https://connectivitycheck.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    proxies:
      - EPODONIOS
rules:
  - MATCH,Proxy
