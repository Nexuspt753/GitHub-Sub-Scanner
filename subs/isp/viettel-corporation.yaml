proxies:
  - type: vless
    name: DeltaKroneckerGithub
    server: 171.244.142.193
    port: 8080
    uuid: e2c6905e-46ec-434b-8400-0bc5bf0363e6
    udp: true
    xudp: true
    network: ws
    ws-opts:
      path: /v-ws
      headers:
        User-Agent: Mozilla/5.0 (GitHub Actions; config-ranker)
proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - Auto
      - DeltaKroneckerGithub
  - name: Auto
    type: url-test
    url: https://connectivitycheck.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    proxies:
      - DeltaKroneckerGithub
rules:
  - MATCH,Proxy
