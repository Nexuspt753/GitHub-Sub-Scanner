proxies:
  - type: vless
    name: Tel-@ProxyMtAlpha🚧
    server: fastter.panelsaaz.ir
    port: 2096
    uuid: 46c84693-c5ee-4b94-92db-97c0f571c9ee
    udp: true
    tls: true
    client-fingerprint: chrome
    servername: fastter.panelsaaz.ir
    flow: xtls-rprx-vision
    xudp: true
    network: ws
    ws-opts:
      path: /upl
      headers:
        User-Agent: Mozilla/5.0 (GitHub Actions; config-ranker)
        Host: fastter.panelsaaz.ir
proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - Auto
      - Tel-@ProxyMtAlpha🚧
  - name: Auto
    type: url-test
    url: https://connectivitycheck.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    proxies:
      - Tel-@ProxyMtAlpha🚧
rules:
  - MATCH,Proxy
