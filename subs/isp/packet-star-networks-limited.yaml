proxies:
  - type: vless
    name: vless
    server: download.onecloudtraining.com
    port: 443
    uuid: 0ad875ef-b751-46e3-aa89-e1ae20e43bcc
    udp: true
    tls: true
    client-fingerprint: chrome
    alpn:
      - h2
      - http/1.1
    xudp: true
proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - Auto
      - vless
  - name: Auto
    type: url-test
    url: https://connectivitycheck.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    proxies:
      - vless
rules:
  - MATCH,Proxy
