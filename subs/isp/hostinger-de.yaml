proxies:
  - type: vless
    name: "[027737]"
    server: dee.im-soon.com
    port: 443
    uuid: SoonTeam
    udp: true
    xudp: true
    network: ws
    ws-opts:
      path: /
      headers:
        User-Agent: Mozilla/5.0 (GitHub Actions; config-ranker)
        Host: play.google.com
  - type: vless
    name: 🇩🇪DE-🚀@VPNine1
    server: dee.im-soon.com
    port: 443
    uuid: SoonTeam
    udp: true
    xudp: true
    network: ws
    ws-opts:
      path: /
      headers:
        User-Agent: Mozilla/5.0 (GitHub Actions; config-ranker)
        Host: play.google.com
  - type: vless
    name: 🔵@chillguy_vpn
    server: dee.im-soon.com
    port: 443
    uuid: SoonTeam
    udp: true
    xudp: true
    network: ws
    ws-opts:
      path: /
      headers:
        User-Agent: Mozilla/5.0 (GitHub Actions; config-ranker)
        Host: play.google.com
proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - Auto
      - "[027737]"
      - 🇩🇪DE-🚀@VPNine1
      - 🔵@chillguy_vpn
  - name: Auto
    type: url-test
    url: https://connectivitycheck.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    proxies:
      - "[027737]"
      - 🇩🇪DE-🚀@VPNine1
      - 🔵@chillguy_vpn
rules:
  - MATCH,Proxy
