proxies:
  - type: vless
    name: vless
    server: de.im-soon.com
    port: 3443
    uuid: SoonTeam
    udp: true
    tls: true
    client-fingerprint: chrome
    xudp: true
proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - Auto
      - vless
  - name: Auto
    type: url-test
    url: https://connectivitycheck.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    proxies:
      - vless
rules:
  - MATCH,Proxy
