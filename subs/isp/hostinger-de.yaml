proxies:
  - type: vless
    name: EPODONIOS
    server: dee.im-soon.com
    port: 443
    uuid: SoonTeam
    udp: true
    xudp: true
    network: ws
    ws-opts:
      path: /
      headers:
        User-Agent: Mozilla/5.0 (GitHub Actions; config-ranker)
        Host: play.google.com
  - type: vless
    name: EPODONIOS-01
    server: dee.im-soon.com
    port: 443
    uuid: SoonTeam
    udp: true
    xudp: true
    network: ws
    ws-opts:
      path: /
      headers:
        User-Agent: Mozilla/5.0 (GitHub Actions; config-ranker)
        Host: play.google.com
  - type: vless
    name: filembad
    server: dee.im-soon.com
    port: 443
    uuid: SoonTeam
    udp: true
    xudp: true
    network: ws
    ws-opts:
      path: /
      headers:
        User-Agent: Mozilla/5.0 (GitHub Actions; config-ranker)
        Host: play.google.com
  - type: vless
    name: کانال
    server: dee.im-soon.com
    port: 443
    uuid: SoonTeam
    udp: true
    xudp: true
    network: ws
    ws-opts:
      path: /
      headers:
        User-Agent: Mozilla/5.0 (GitHub Actions; config-ranker)
        Host: play.google.com
  - type: vless
    name: "[32091]"
    server: dee.im-soon.com
    port: 443
    uuid: SoonTeam
    udp: true
    xudp: true
    network: ws
    ws-opts:
      path: /
      headers:
        User-Agent: Mozilla/5.0 (GitHub Actions; config-ranker)
        Host: play.google.com
proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - Auto
      - EPODONIOS
      - EPODONIOS-01
      - filembad
      - کانال
      - "[32091]"
  - name: Auto
    type: url-test
    url: https://connectivitycheck.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    proxies:
      - EPODONIOS
      - EPODONIOS-01
      - filembad
      - کانال
      - "[32091]"
rules:
  - MATCH,Proxy
