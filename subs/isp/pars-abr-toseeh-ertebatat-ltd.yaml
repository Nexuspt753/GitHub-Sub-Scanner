proxies:
  - type: vless
    name: 🇮🇹⇝
    server: getwww.restaurantcloud.ir
    port: 5001
    uuid: 7058ebbd-96af-43f2-ba81-d8e289cb4358
    udp: true
    tls: true
    client-fingerprint: chrome
    servername: lest.zivaroid.ir
    xudp: true
    network: ws
    ws-opts:
      path: /
      headers:
        User-Agent: Mozilla/5.0 (GitHub Actions; config-ranker)
proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - Auto
      - 🇮🇹⇝
  - name: Auto
    type: url-test
    url: https://connectivitycheck.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    proxies:
      - 🇮🇹⇝
rules:
  - MATCH,Proxy
