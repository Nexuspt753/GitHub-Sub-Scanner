proxies:
  - type: vless
    name: vless
    server: pix.gilangard.ir
    port: 8443
    uuid: 7ee2a33c-94c0-4af7-8f86-f42bef3e9e02
    udp: true
    tls: true
    client-fingerprint: chrome
    alpn:
      - h3
      - h2
      - http/1.1
    xudp: true
proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - Auto
      - vless
  - name: Auto
    type: url-test
    url: https://connectivitycheck.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    proxies:
      - vless
rules:
  - MATCH,Proxy
