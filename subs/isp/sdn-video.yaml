proxies:
  - type: vless
    name: DeltaKroneckerGithub
    server: 78.159.246.110
    port: 443
    uuid: bc5ec86c-3e65-4272-994c-59a924c72a68
    udp: true
    tls: true
    client-fingerprint: chrome
    servername: fbsv6.guardora.pro
    xudp: true
    network: ws
    ws-opts:
      path: /ws
      headers:
        User-Agent: Mozilla/5.0 (GitHub Actions; config-ranker)
proxy-groups:
