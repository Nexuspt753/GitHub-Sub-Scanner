proxies:
  - type: vless
    name: vless
    server: s5.zynetrax.ir
    port: 2087
    uuid: 042f444a-f202-433c-873d-589081ec2102
    udp: true
    tls: true
    client-fingerprint: chrome
    xudp: true
proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - Auto
      - vless
  - name: Auto
    type: url-test
    url: https://connectivitycheck.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    proxies:
      - vless
rules:
  - MATCH,Proxy
