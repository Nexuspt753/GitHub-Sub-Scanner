<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Config Ranking</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px; background: #0d1117; color: #e6edf3;
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .meta { color: #8b949e; margin: 0 0 20px; font-size: 13px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid #21262d; }
  th { cursor: pointer; color: #58a6ff; white-space: nowrap; user-select: none; }
  th:hover { text-decoration: underline; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .alive { color: #3fb950; font-weight: 600; }
  .dead { color: #f85149; font-weight: 600; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  .muted { color: #8b949e; }
  .score { font-weight: 700; color: #d2a8ff; }
  #loading, #error { padding: 20px 0; }
  #error { color: #f85149; }
  .subs { display: flex; flex-direction: column; gap: 8px; margin-bottom: 28px; }
  .sub { display: flex; align-items: center; gap: 12px; padding: 8px 10px;
    border: 1px solid #21262d; border-radius: 6px; }
  .subinfo { min-width: 200px; font-weight: 600; }
  .suburl { flex: 1; color: #8b949e; font-family: ui-monospace, monospace;
    font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  button.copy { background: #238636; color: #fff; border: 0; border-radius: 6px;
    padding: 5px 12px; cursor: pointer; }
</style>
</head>
<body>
<h1>Config Ranking</h1>
<p class="meta">Auto-generated by GitHub Actions. Updated: <span id="updated">…</span> ·
  <span id="summary"></span></p>
<div id="loading">Loading results…</div>
<div id="error" hidden></div>
<table id="tbl" hidden>
  <thead>
    <tr>
      <th data-k="score">Score</th>
      <th data-k="name">Name</th>
      <th data-k="protocol">Proto</th>
      <th data-k="country">Country</th>
      <th data-k="city">City</th>
      <th data-k="isp">ISP / DC</th>
      <th data-k="alive">Alive</th>
      <th data-k="tcp_ping_ms">TCP ping</th>
      <th data-k="speed_mbps">Speed</th>
      <th data-k="gemini_reachable">Gemini</th>
      <th data-k="address">Server</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<h2 style="font-size:16px;margin:28px 0 6px;">Subscription groups</h2>
<p class="meta">Base64-encoded v2ray subscriptions. Add any link to your client
  (v2rayN / v2rayNG / Hiddify / Streisand).</p>
<div id="subs" class="subs"></div>

<script>
const $ = (s) => document.querySelector(s);

function cell(v) {
  const td = document.createElement("td");
  td.textContent = (v === null || v === undefined) ? "—" : v;
  return td;
}

function render(data) {
  $("#updated").textContent = data.updated_at || "?";
  $("#summary").textContent =
    `${data.alive_count ?? 0}/${data.node_count ?? 0} alive · ` +
    `${data.gemini_count ?? 0} reach Gemini`;

  const tbody = $("table tbody");
  tbody.innerHTML = "";
  for (const n of data.nodes || []) {
    const tr = document.createElement("tr");

    const score = cell(n.score ?? "—");
    score.className = "num score";
    tr.appendChild(score);

    tr.appendChild(cell(n.name));

    const proto = cell(n.protocol);
    proto.className = "mono";
    tr.appendChild(proto);

    tr.appendChild(cell(n.country));
    tr.appendChild(cell(n.city));

    const isp = cell(n.isp);
    isp.className = "muted";
    tr.appendChild(isp);

    const alive = document.createElement("td");
    alive.className = "num";
    if (n.alive === true) { alive.textContent = "✓"; alive.classList.add("alive"); }
    else if (n.alive === false) { alive.textContent = "✗"; alive.classList.add("dead"); }
    else { alive.textContent = "—"; alive.classList.add("muted"); }
    tr.appendChild(alive);

    const ping = cell(n.tcp_ping_ms == null ? "—" : n.tcp_ping_ms + " ms");
    ping.className = "num";
    tr.appendChild(ping);

    const speed = cell(n.speed_mbps == null ? "—" : n.speed_mbps + " Mbps");
    speed.className = "num";
    tr.appendChild(speed);

    const gem = document.createElement("td");
    gem.className = "num";
    if (n.gemini_reachable === true) { gem.textContent = "✓"; gem.classList.add("alive"); }
    else if (n.gemini_reachable === false) { gem.textContent = "✗"; gem.classList.add("muted"); }
    else { gem.textContent = "—"; gem.classList.add("muted"); }
    tr.appendChild(gem);

    const srv = cell(`${n.address}:${n.port}`);
    srv.className = "mono";
    tr.appendChild(srv);

    tbody.appendChild(tr);
  }
}

let state = { key: "score", dir: -1 };
function sortKey(n, key) {
  if (key === "alive" || key === "gemini_reachable") return n[key] ? 1 : 0;
  if (key === "score" || key === "speed_mbps" || key === "tcp_ping_ms") {
    const v = n[key];
    if (v === null || v === undefined) return -Infinity;
    return v;
  }
  return (n[key] || "").toString().toLowerCase();
}
function sort() {
  const data = state.data;
  data.nodes.sort((a, b) => {
    const av = sortKey(a, state.key), bv = sortKey(b, state.key);
    if (av < bv) return -state.dir;
    if (av > bv) return state.dir;
    return 0;
  });
  render(data);
}
document.querySelectorAll("th").forEach((th) => {
  th.addEventListener("click", () => {
    const k = th.dataset.k;
    if (state.key === k) state.dir *= -1;
    else { state.key = k; state.dir = -1; }
    sort();
  });
});

fetch("results.json", { cache: "no-store" })
  .then((r) => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
  .then((data) => {
    state.data = data;
    $("#loading").hidden = true;
    $("#tbl").hidden = false;
    sort();
  })
  .catch((e) => {
    $("#loading").hidden = true;
    const err = $("#error");
    err.hidden = false;
    err.textContent = "Could not load results.json: " + e.message;
  });

function copyText(t) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(t).catch(() => fallbackCopy(t));
  } else fallbackCopy(t);
}
function fallbackCopy(t) {
  const ta = document.createElement("textarea");
  ta.value = t; document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); } catch (e) {}
  document.body.removeChild(ta);
}

fetch("subs/manifest.json", { cache: "no-store" })
  .then((r) => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
  .then((m) => {
    const box = $("#subs");
    box.innerHTML = "";
    const groups = m.groups || [];
    if (!groups.length) { box.textContent = "No groups yet — run the workflow once."; return; }
    for (const g of groups) {
      const row = document.createElement("div");
      row.className = "sub";
      const info = document.createElement("span");
      info.className = "subinfo";
      info.textContent = g.name + " (" + g.count + ")";
      const link = document.createElement("a");
      link.href = g.url; link.textContent = g.url;
      link.target = "_blank"; link.rel = "noopener"; link.className = "suburl";
      const btn = document.createElement("button");
      btn.textContent = "Copy"; btn.className = "copy";
      btn.onclick = () => {
        copyText(g.url); btn.textContent = "Copied";
        setTimeout(() => { btn.textContent = "Copy"; }, 1200);
      };
      row.append(info, link, btn);
      box.appendChild(row);
    }
  })
  .catch(() => {
    $("#subs").textContent = "manifest.json not found — run the workflow once.";
  });
</script>
</body>
</html>
