name: Test & Rank Configs

on:
  schedule:
    # Every 2 hours (UTC). Min allowed is 5 min; public repos = free minutes.
    # NOTE: GitHub may delay the first scheduled run on a new repo while it registers the cron.
    - cron: "0 */2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: rank
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python scripts/runner.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results.json subs/
          git commit -m "chore: update config ranking $(date -u +%FT%TZ)" || echo "No changes"
          git push
